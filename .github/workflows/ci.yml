name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the FastAPI image
        run: docker build -t swiftbite-backend:ci ./backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the React image
        run: docker build -t swiftbite-frontend:ci ./frontend

  compose-smoke-test:
    name: Compose up and hit the API
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "backend is up"; exit 0
            fi
            echo "waiting... ($i/30)"; sleep 5
          done
          echo "backend never became healthy"; docker compose logs; exit 1

      - name: Smoke-test the API
        run: |
          curl -sf http://localhost:8000/api/restaurants | grep -q "Bella Napoli"
          curl -sf -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@swiftbite.com","password":"demo1234"}' | grep -q access_token
          echo "API smoke test passed"

      - name: Tear down
        if: always()
        run: docker compose down -v
