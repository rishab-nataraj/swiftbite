# SwiftBite - local development stack
# Start everything with:  docker compose up --build
# Frontend  -> http://localhost:5173
# API docs  -> http://localhost:8000/docs
# Postgres  -> localhost:5432

services:
  db:
    image: postgres:16-alpine
    container_name: swiftbite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftbite}
      POSTGRES_DB: ${POSTGRES_DB:-swiftbite}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiftbite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftbite-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swiftbite-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swiftbite}:${POSTGRES_PASSWORD:-swiftbite}@db:5432/${POSTGRES_DB:-swiftbite}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app   # live code reload during development
    networks:
      - swiftbite-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftbite-frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src   # hot reload on file save
      - ./frontend/index.html:/app/index.html
    networks:
      - swiftbite-net

volumes:
  pgdata:

networks:
  swiftbite-net:
    driver: bridge
